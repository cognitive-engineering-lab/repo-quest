name: Release

on:
  pull_request:
    branches: [main]
    types: [labeled,closed]

jobs:
  publish-images:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    env:
      RQ_VERSION: ${{ github.event.pull_request.title }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-docker-action@v5
        with:
          version: v29.4.1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.1.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform images
        run: |
          RQ_IMAGE_TAG=$RQ_VERSION docker compose -f compose.yml -f compose.ci.yml build --push
          docker compose -f compose.yml -f compose.ci.yml build --push

      - name: Publish Compose application
        run: |
          docker compose publish -y "ghcr.io/cognitive-engineering-lab/repoquest-compose:$RQ_VERSION"
          docker compose publish -y "ghcr.io/cognitive-engineering-lab/repoquest-compose:latest"

