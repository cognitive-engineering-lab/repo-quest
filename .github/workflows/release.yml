name: Release

on:
  pull_request:
    branches: [main]
    types: [labeled,closed]

jobs:
  publish-images:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    env:
      RQ_IMAGE_TAG: ${{ github.event.pull_request.title }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker compose build

      - name: Push versioned images
        run: docker compose push forgejo forgejo-runner repoquest reverse-proxy

      - name: Publish Compose application
        run: docker compose publish -y "ghcr.io/cognitive-engineering-lab/repoquest-compose:$RQ_IMAGE_TAG"

