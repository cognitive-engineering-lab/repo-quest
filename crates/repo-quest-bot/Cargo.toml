[package]
name = "repo-quest-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
async-lock = "3.4.1"
axum = { version = "0.8.6", features = ["form", "macros", "multipart", "ws"] }
forgejo-api = "0.9.2"
reqwest = "0.12.24"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "fs", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6.6", features = ["cors", "normalize-path"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
url = "2.5.7"
# reduces size of `url` dependencies, see https://docs.rs/crate/idna_adapter/latest
idna_adapter = "=1.1.0" 

anyhow = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
mustache = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }

repo-quest-core = { path = "../repo-quest-core" }
