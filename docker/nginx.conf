server {
    listen 8085 default_server;
    listen [::]:8085 default_server;

    location /rq/ {
        proxy_pass  http://repoquest:8000/;

        # Quest bundles can be large; the bot disables axum's body limit, so
        # don't let nginx impose its 1m default either.
        client_max_body_size 0;

        # websocket support
        # note(wcrichto): once nginx updates, proxy_http_version will no longer be needed.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass  http://forgejo:3000/;

        # Auto-login user as the hero
        proxy_set_header X-WEBAUTH-USER hero;
    }
}
