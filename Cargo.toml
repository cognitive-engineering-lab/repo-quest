[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cognitive-engineering-lab/repo-quest"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.52", features = ["derive"] }
env_logger = "0.11.8"
flate2 = "1.1.5"
tar = "0.4.44"
tempfile = "3.23.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
regex = "1" # to eliminate duplicates w/ transitive deps
mustache = "0.9.0"
log = "0.4.28"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
struct_field_names = "allow"
items_after_statements = "allow"