[package]
name = "repo-quest"
version = "0.1.0"
edition = "2024"
default-run = "repo-quest-bot"

[lib]
name = "repo_quest"
path = "src/lib.rs"

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.100"
async-lock = "3.4.1"
axum = { version = "0.8.6", features = ["form", "macros", "multipart"] }
clap = { version = "4.5.52", features = ["derive"] }
env_logger = "0.11.8"
flate2 = "1.1.5"
forgejo-api = "0.9.2"
itertools = "0.14.0"
log = "0.4.28"
octocrab = "0.49.5"
regex = "1.11.1"
reqwest = "0.12.24"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
tar = "0.4.44"
tempfile = "3.23.0"
tera = "1.20.0"
termtree = "1.0.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "1.0.6"
tower-http = { version = "0.6.6", features = ["cors", "normalize-path"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
url = "2.5.7"
