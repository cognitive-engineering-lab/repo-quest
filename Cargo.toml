[package]
name = "repo-quest-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-lock = "3.4.1"
axum = { version = "0.8.6", features = ["form", "macros"] }
env_logger = "0.11.8"
forgejo-api = "0.7.0"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tera = "1.20.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "normalize-path"] }
tower-layer = "0.3.3"
url = "2.5.7"
