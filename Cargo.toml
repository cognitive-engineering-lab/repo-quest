[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.52", features = ["derive"] }
env_logger = "0.11.8"
flate2 = "1.1.5"
tar = "0.4.44"
tempfile = "3.23.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
regex = "1" # to eliminate duplicates w/ transitive deps
mustache = "0.9.0"
log = "0.4.28"