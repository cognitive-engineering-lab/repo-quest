[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tokio = "1.42.0"
serde = "1.0.204"
serde_json = "1.0.120"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
specta = "=2.0.0-rc.20"
eyre = "0.6.12"
color-eyre = "0.6.3"

[profile.release]
strip = true
lto = true
